<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Iran vs Israel — 2D animated comparison. Digits and symbols only: no words are ever drawn.
const W=1920,H=1080;const cv=document.getElementById('c');const ctx=cv.getContext('2d');
let G=null,T=null;
const IR='#21C46B',IR2='#8EF5B8',IL='#3D8BFF',IL2='#A9CCFF',US='#E8434B',BG1='#050A18',BG2='#0B1834',CY='#4FD8FF',GOLD='#FFC542',RED='#FF4A3D';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-clamp(k),3);
const eio=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const eback=k=>{k=clamp(k);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const ramp=(t,a,d)=>clamp((t-a)/d);
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const pc={};function cp(k,d){return pc[k]||(pc[k]=new Path2D(d));}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

// ---------- background
function bg(t,tint){
  const g=ctx.createRadialGradient(W/2,H*0.45,50,W/2,H/2,1200);g.addColorStop(0,tint||BG2);g.addColorStop(1,BG1);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(79,216,255,0.06)';ctx.lineWidth=1;const off=(t*20)%60;
  for(let x=-60+off;x<W+60;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=-60+off*0.5;y<H+60;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();particles(t);
}
function particles(t){ctx.save();for(let i=0;i<90;i++){const sp=10+rnd(i)*30;const x=(rnd(i+1)*W+t*sp*(rnd(i+2)>.5?1:-1)+W*10)%W;const y=(rnd(i+3)*H-t*sp*0.6+H*10)%H;
  ctx.fillStyle=`rgba(160,220,255,${0.15+0.35*Math.abs(Math.sin(t*1.5+i))})`;ctx.beginPath();ctx.arc(x,y,0.8+rnd(i+4)*1.8,0,7);ctx.fill();}ctx.restore();}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.72)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function letterbox(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,60);ctx.fillRect(0,H-60,W,60);}
function scanline(t){ctx.save();ctx.globalAlpha=0.05;const y=(t*400)%(H+300)-150;const g=ctx.createLinearGradient(0,y-80,0,y+80);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,y-80,W,160);ctx.restore();}
// rotating "breaking" style corner ticker made of shapes only
function hud(t){ctx.save();ctx.globalAlpha=0.55;ctx.strokeStyle=CY;ctx.lineWidth=2;
  for(const [x,y,sx,sy] of [[40,80,1,1],[W-40,80,-1,1],[40,H-80,1,-1],[W-40,H-80,-1,-1]]){ctx.beginPath();ctx.moveTo(x,y+sy*40);ctx.lineTo(x,y);ctx.lineTo(x+sx*40,y);ctx.stroke();}
  // live dot
  ctx.globalAlpha=0.6+0.4*Math.sin(t*6);ctx.fillStyle=RED;ctx.beginPath();ctx.arc(W-90,105,8,0,7);ctx.fill();ctx.restore();}

// ---------- flags (no text, no inscriptions)
function circleClip(x,y,r,fn,c){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();fn();ctx.restore();ring(x,y,r,c);}
function ring(x,y,r,c){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=Math.max(2,r*0.07);ctx.shadowColor=c;ctx.shadowBlur=r*0.5;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.restore();}
function flagIR(x,y,r){if(r<=0)return;circleClip(x,y,r,()=>{
  ctx.fillStyle='#239F40';ctx.fillRect(x-r,y-r,2*r,2*r/3);ctx.fillStyle='#fff';ctx.fillRect(x-r,y-r/3,2*r,2*r/3);ctx.fillStyle='#DA0000';ctx.fillRect(x-r,y+r/3,2*r,2*r/3);
  // simplified red emblem (abstract tulip form)
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#DA0000';const s=r*0.26;
  ctx.beginPath();ctx.moveTo(0,-s);ctx.bezierCurveTo(s*0.9,-s*0.6,s*0.9,s*0.7,0,s);ctx.bezierCurveTo(-s*0.9,s*0.7,-s*0.9,-s*0.6,0,-s);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,s*0.28,s*0.75,0,0,7);ctx.fill();ctx.fillStyle='#DA0000';ctx.fillRect(-s*0.07,-s*0.95,s*0.14,s*1.9);ctx.restore();
},IR);}
function flagIL(x,y,r){if(r<=0)return;circleClip(x,y,r,()=>{
  ctx.fillStyle='#fff';ctx.fillRect(x-r,y-r,2*r,2*r);ctx.fillStyle='#0038B8';ctx.fillRect(x-r,y-r*0.68,2*r,r*0.22);ctx.fillRect(x-r,y+r*0.46,2*r,r*0.22);
  ctx.save();ctx.translate(x,y);ctx.strokeStyle='#0038B8';ctx.lineWidth=r*0.07;const s=r*0.36;
  for(const rot of [0,Math.PI]){ctx.beginPath();for(let i=0;i<3;i++){const a=rot-Math.PI/2+i*2*Math.PI/3;ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);}ctx.closePath();ctx.stroke();}ctx.restore();
},IL);}
function flagUS(x,y,r){if(r<=0)return;circleClip(x,y,r,()=>{
  for(let i=0;i<13;i++){ctx.fillStyle=i%2?'#fff':'#B22234';ctx.fillRect(x-r,y-r+i*2*r/13,2*r,2*r/13+1);}
  ctx.fillStyle='#3C3B6E';ctx.fillRect(x-r,y-r,r*1.0,r*1.08);ctx.fillStyle='#fff';
  for(let i=0;i<5;i++)for(let j=0;j<4;j++){ctx.beginPath();ctx.arc(x-r+r*0.14+j*r*0.24+(i%2)*r*0.12,y-r+r*0.14+i*r*0.2,r*0.035,0,7);ctx.fill();}
},'#9fb7ff');}

// ---------- digits & symbols
function num(v,x,y,size,color,a=1,align='center'){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`900 ${size}px "Inter Display", Inter, sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';
  const s=String(v);ctx.shadowColor=color;ctx.shadowBlur=size*0.35;ctx.fillStyle=color;ctx.fillText(s,x,y);
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.globalAlpha=a*0.92;ctx.fillText(s,x,y);ctx.globalAlpha=a;ctx.lineWidth=size*0.025;ctx.strokeStyle=color;ctx.strokeText(s,x,y);ctx.restore();}
function counter(target,t,start,dur,x,y,size,color,align){
  if(t<start)return;const k=eo((t-start)/dur);const v=Math.round(target*k);
  const pop=t>start+dur?1+0.18*Math.max(0,1-(t-start-dur)/0.25):1;
  ctx.save();ctx.translate(x,y);ctx.scale(pop,pop);num(v,0,0,size,color,clamp((t-start)/0.15),align);ctx.restore();
  const ft=t-start-dur;if(ft>0&&ft<0.6){ctx.save();ctx.globalAlpha=(1-ft/0.6)*0.7;ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y,size*2.2*(0.6+ft),size*0.7*(0.6+ft),0,0,7);ctx.stroke();ctx.restore();}}
function bar(x,y,w,h,k,color){ctx.save();ctx.fillStyle='rgba(255,255,255,0.07)';rr(x,y,w,h,h/2);ctx.fill();
  const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,color);g.addColorStop(1,'#fff');ctx.fillStyle=g;ctx.shadowColor=color;ctx.shadowBlur=20;rr(x,y,Math.max(h,w*k),h,h/2);ctx.fill();ctx.restore();}
function qmark(x,y,size,color,a){ // drawn question mark (a symbol)
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`900 ${size}px "Inter Display", Inter, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=color;ctx.shadowBlur=size*0.4;ctx.fillStyle=color;ctx.fillText('?',x,y);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.globalAlpha=a*0.9;ctx.fillText('?',x,y);ctx.restore();}

// ---------- illustrations
function soldier(x,y,s,c,ph){ctx.save();ctx.translate(x,y);ctx.scale(s/100,s/100);ctx.fillStyle=c;const sw=Math.sin(ph)*14;
  ctx.lineCap='round';ctx.strokeStyle=c;ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(0,-45);ctx.lineTo(sw,-2);ctx.moveTo(0,-45);ctx.lineTo(-sw,-2);ctx.stroke();
  ctx.beginPath();ctx.roundRect(-11,-80,22,40,6);ctx.fill();ctx.beginPath();ctx.roundRect(-18,-78,10,26,3);ctx.fill();
  ctx.beginPath();ctx.arc(0,-90,9,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(0,-95,13,8,0,Math.PI,0);ctx.fill();
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(6,-60);ctx.lineTo(14,-112);ctx.stroke();ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(4,-75);ctx.lineTo(10,-52);ctx.stroke();ctx.restore();}
function missile(x,y,s,body,band,rot=0,flame=0){ // vertical ballistic missile, base at (x,y), height ~ s
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s/100,s/100);
  if(flame>0){const g=ctx.createRadialGradient(0,8,0,0,20,40*flame);g.addColorStop(0,'rgba(255,240,180,1)');g.addColorStop(0.4,'rgba(255,150,40,0.9)');g.addColorStop(1,'rgba(255,60,20,0)');ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(-7,0);ctx.quadraticCurveTo(0,60*flame+Math.sin(Date.now())*0,7,0);ctx.fill();ctx.beginPath();ctx.ellipse(0,18*flame,10,30*flame,0,0,7);ctx.fill();}
  ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-8,-74);ctx.quadraticCurveTo(-8,-92,0,-100);ctx.quadraticCurveTo(8,-92,8,-74);ctx.lineTo(8,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=band;ctx.fillRect(-8,-62,16,7);ctx.fillRect(-8,-30,16,4);
  ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-17,8);ctx.lineTo(-17,-6);ctx.lineTo(-8,-18);ctx.fill();ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(17,8);ctx.lineTo(17,-6);ctx.lineTo(8,-18);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(-5,-72,3,66);ctx.restore();}
function launcherTruck(x,y,s,c,kind,t,dir=1){ // kind 0 Iron Dome, 1 David's Sling, 2 Arrow
  ctx.save();ctx.translate(x,y);ctx.scale(dir*s/100,s/100);ctx.fillStyle='#0a1222';
  for(const wx of [-80,-50,40,70]){ctx.beginPath();ctx.arc(wx,-12,13,0,7);ctx.fill();}
  ctx.fillStyle=c;ctx.fillRect(-105,-40,200,18);ctx.beginPath();ctx.moveTo(95,-40);ctx.lineTo(130,-40);ctx.lineTo(130,-22);ctx.lineTo(95,-22);ctx.fill();
  ctx.beginPath();ctx.moveTo(96,-40);ctx.lineTo(96,-72);ctx.lineTo(118,-72);ctx.lineTo(132,-50);ctx.lineTo(132,-40);ctx.fill();
  ctx.fillStyle='rgba(180,240,255,0.7)';ctx.beginPath();ctx.moveTo(110,-68);ctx.lineTo(118,-68);ctx.lineTo(127,-52);ctx.lineTo(110,-52);ctx.fill();
  ctx.fillStyle=c;
  if(kind===0){ctx.save();ctx.translate(-30,-58);ctx.rotate(-0.75);ctx.fillRect(-10,-40,130,80);ctx.fillStyle='#0a1222';
    for(let i=0;i<5;i++)for(let j=0;j<4;j++){ctx.beginPath();ctx.arc(126,-30+i*15,5,0,7);ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,0.15)';for(let i=0;i<4;i++)ctx.fillRect(0,-32+i*20,118,3);ctx.restore();}
  else if(kind===1){ctx.save();ctx.translate(-40,-42);ctx.rotate(-1.45);ctx.fillRect(0,-38,150,76);ctx.fillStyle='#0a1222';
    for(let i=0;i<3;i++)for(let j=0;j<4;j++){ctx.fillRect(146,-34+j*18,6,14);}ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(0,-2,150,4);ctx.restore();}
  else {ctx.save();ctx.translate(-50,-42);ctx.rotate(-1.15);for(let i=0;i<3;i++){ctx.fillStyle=c;rr(0,-36+i*24,190,20,10);ctx.fill();ctx.fillStyle='#0a1222';ctx.beginPath();ctx.arc(190,-26+i*24,7,0,7);ctx.fill();}ctx.restore();}
  ctx.restore();}
function radar(x,y,s,c,t){ctx.save();ctx.translate(x,y);ctx.scale(s/100,s/100);ctx.fillStyle=c;ctx.fillRect(-6,-40,12,40);ctx.save();ctx.translate(0,-50);ctx.scale(Math.cos(t*2),1);ctx.fillRect(-45,-35,90,60);ctx.restore();ctx.restore();}
function building(x,y,w,h,c,lit,t,seed){ctx.save();const g=ctx.createLinearGradient(x,y-h,x+w,y);g.addColorStop(0,c);g.addColorStop(1,'rgba(10,20,40,0.95)');ctx.fillStyle=g;ctx.fillRect(x,y-h,w,h);
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(x,y-h,4,h);
  for(let r=0;r<Math.floor(h/26)-1;r++)for(let k=0;k<Math.floor(w/18);k++){const on=rnd(seed+r*13+k*7)<lit;ctx.fillStyle=on?`rgba(255,226,150,${0.55+0.3*Math.sin(t*2+r+k)})`:'rgba(255,255,255,0.05)';ctx.fillRect(x+6+k*18,y-h+14+r*26,9,13);}
  ctx.restore();}
function coin(x,y,r,a,rot){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(Math.cos(rot),1);const g=ctx.createRadialGradient(-r*0.3,-r*0.3,1,0,0,r);g.addColorStop(0,'#fff3c0');g.addColorStop(1,'#d79a12');ctx.fillStyle=g;ctx.shadowColor=GOLD;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#8a5a00';ctx.font=`900 ${r*1.3}px Inter, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,2);ctx.restore();}
function carrier(x,y,s,c,dir){ctx.save();ctx.translate(x,y);ctx.scale(dir*s/100,s/100);ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(-180,-30);ctx.lineTo(200,-30);ctx.lineTo(170,10);ctx.lineTo(-160,10);ctx.closePath();ctx.fill();ctx.fillRect(-190,-40,400,12);
  ctx.beginPath();ctx.moveTo(60,-40);ctx.lineTo(110,-40);ctx.lineTo(104,-80);ctx.lineTo(70,-80);ctx.closePath();ctx.fill();ctx.fillRect(84,-110,4,32);ctx.restore();}
function jetTop(x,y,s,c,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(s/100,s/100);ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(0,-50);ctx.lineTo(8,-20);ctx.lineTo(45,15);ctx.lineTo(45,24);ctx.lineTo(8,12);ctx.lineTo(7,34);ctx.lineTo(20,46);ctx.lineTo(20,52);ctx.lineTo(0,46);ctx.lineTo(-20,52);ctx.lineTo(-20,46);ctx.lineTo(-7,34);ctx.lineTo(-8,12);ctx.lineTo(-45,24);ctx.lineTo(-45,15);ctx.lineTo(-8,-20);ctx.closePath();ctx.fill();ctx.restore();}
function shieldIcon(x,y,s,c,a,fill=0.25){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s/100,s/100);ctx.strokeStyle=c;ctx.lineWidth=6;ctx.shadowColor=c;ctx.shadowBlur=25;
  ctx.beginPath();ctx.moveTo(0,-50);ctx.lineTo(40,-36);ctx.bezierCurveTo(40,10,25,35,0,52);ctx.bezierCurveTo(-25,35,-40,10,-40,-36);ctx.closePath();ctx.stroke();ctx.fillStyle=c;ctx.globalAlpha=a*fill;ctx.fill();ctx.restore();}
function dome(cx,cy,r,c,a,t,crack){ // hemispherical energy shield
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.85,c.replace('1)','0.10)'));g.addColorStop(1,c.replace('1)','0.35)'));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle=c;ctx.shadowColor=c;ctx.shadowBlur=25;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.stroke();
  // hex shimmer
  ctx.globalAlpha=a*0.25;ctx.lineWidth=1;for(let i=1;i<6;i++){ctx.beginPath();ctx.ellipse(cx,cy,r,r*i/6,0,Math.PI,0);ctx.stroke();}
  for(let i=1;i<8;i++){const ang=Math.PI+i*Math.PI/8;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r);ctx.stroke();}
  const sw=(t*0.6)%1;ctx.globalAlpha=a*0.5*(1-sw);ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,r*sw,Math.PI,0);ctx.stroke();
  if(crack>0){ctx.globalAlpha=a*crack;ctx.strokeStyle='#fff';ctx.shadowColor=RED;ctx.lineWidth=3;
    for(let k=0;k<5;k++){const a0=Math.PI*(1.15+k*0.17);let px=cx+Math.cos(a0)*r,py=cy+Math.sin(a0)*r;ctx.beginPath();ctx.moveTo(px,py);
      for(let j=0;j<4;j++){px+=(rnd(k*9+j)-0.5)*60*crack-Math.cos(a0)*20*crack;py+=(rnd(k*7+j+3)*30)*crack;ctx.lineTo(px,py);}ctx.stroke();}}
  ctx.restore();}
function burst(x,y,k,c){if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha=1-k;const r=10+k*70;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(0.3,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let i=0;i<10;i++){const a=i/10*Math.PI*2;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r*0.4,y+Math.sin(a)*r*0.4);ctx.lineTo(x+Math.cos(a)*r*0.9,y+Math.sin(a)*r*0.9);ctx.stroke();}ctx.restore();}
function streak(x0,y0,x1,y1,k,c,w,tail=0.25){ // moving point with trail along straight line
  const k0=Math.max(0,k-tail);const ax=lerp(x0,x1,k0),ay=lerp(y0,y1,k0),bx=lerp(x0,x1,k),by=lerp(y0,y1,k);
  ctx.save();const g=ctx.createLinearGradient(ax,ay,bx,by);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,c);ctx.strokeStyle=g;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  ctx.fillStyle='#fff';ctx.shadowColor=c;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(bx,by,w*0.9,0,7);ctx.fill();ctx.restore();}
function qbez(p0,p1,p2,k){const a=(1-k)*(1-k),b=2*(1-k)*k,c=k*k;return [a*p0[0]+b*p1[0]+c*p2[0],a*p0[1]+b*p1[1]+c*p2[1]];}
function arcPath(p0,p1,p2,k0,k1,c,w,dash){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=w;ctx.shadowColor=c;ctx.shadowBlur=18;if(dash)ctx.setLineDash(dash);ctx.beginPath();
  for(let i=0;i<=40;i++){const k=lerp(k0,k1,i/40);const p=qbez(p0,p1,p2,k);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();ctx.restore();}

// ---------- maps
function cam(c){ctx.translate(W/2,H/2);ctx.scale(c.s,c.s);ctx.translate(-c.x,-c.y);}
function w2s(p,c){return [(p[0]-c.x)*c.s+W/2,(p[1]-c.y)*c.s+H/2];}
function pulseFill(path,c,fillA,t,glow){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=glow;ctx.fillStyle=c;ctx.globalAlpha*=fillA;ctx.fill(path);ctx.restore();}
function drawME(t,c,kIR,kIL,a,s){
  const M=G.me;ctx.save();ctx.globalAlpha=a;cam(c);
  ctx.fillStyle='rgba(40,60,100,0.35)';ctx.strokeStyle='rgba(120,160,220,0.28)';ctx.lineWidth=1.2/c.s;
  for(const d of M.others){const p=cp('me'+d.length+d.slice(0,30),d);ctx.fill(p);ctx.stroke(p);}
  const pir=cp('meir',M.ir),pil=cp('meil',M.il);

// ---------- transitions
function transitions(t){
  for(const c of [T.s2,T.s3,T.s4,T.s5,T.s6,T.s7]){const d=t-c;if(d>-0.15&&d<0.32){const k=d<0?(d+0.15)/0.15:1-d/0.32;

    ctx.save();ctx.globalAlpha=0.45*clamp(k);for(let i=0;i<16;i++){const y=rnd(i+c)*H;ctx.fillStyle=i%2?'#bfefff':'#ffd9a0';ctx.fillRect(0,y,W,2+rnd(i)*6);}ctx.restore();}}}

};
