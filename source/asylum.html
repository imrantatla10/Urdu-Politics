<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
</head><body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Square 1080x1080, 60 s, no voiceover. Only on-screen text: country names + digits.
const W=1080,H=1080;const cv=document.getElementById('c');const ctx=cv.getContext('2d');
const DUR=60;
let FC=null,BY={};
const C={PK:'#1FCB6B',PK2:'#9CF7C2',UK:'#3D8BFF',UK2:'#A9CCFF',RED:'#FF3B4A',GOLD:'#FFC447',CY:'#4FD8FF',
  AF:'#FF8A3D',SY:'#E25CFF',IR:'#FFD84A',IQ:'#FF5C8A',BG1:'#03060F',BG2:'#0A1A38',SKIN:'#E9C8A6',SKIN2:'#C99A72'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-clamp(k),3);
const eio=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const eback=k=>{k=clamp(k);const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function win(t,a,b,fi=.4,fo=.4){return clamp((t-a)/fi)*clamp((b-t)/fo);}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

function init(fc){FC=fc;for(const f of fc.features)BY[f.properties.name]=f;
  for(const n of ['United Kingdom','Pakistan','Afghanistan','Syria','Iran','Iraq'])BY[n].c=d3.geoCentroid(BY[n]);
  BY['United Kingdom'].c=[-2.2,53.6];}

// ---------------- background
function bg(t,tint){
  const g=ctx.createRadialGradient(W/2,H*0.45,40,W/2,H/2,900);g.addColorStop(0,tint||C.BG2);g.addColorStop(1,C.BG1);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  for(let i=0;i<220;i++){const x=rnd(i)*W,y=rnd(i+9)*H;const a=0.15+0.6*Math.abs(Math.sin(t*0.8+i*1.7))*rnd(i+3);
    ctx.fillStyle=`rgba(200,225,255,${a})`;ctx.beginPath();ctx.arc(x,y,0.5+rnd(i+5)*1.4,0,7);ctx.fill();}
  ctx.restore();
}
function floorGrid(t,y0,col){ // perspective floor
  ctx.save();ctx.strokeStyle=col||'rgba(79,216,255,0.18)';ctx.lineWidth=1.2;
  for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(W/2+i*18,y0);ctx.lineTo(W/2+i*160,H);ctx.stroke();}
  for(let j=0;j<12;j++){const k=((j+(t*0.6)%1)/12);const y=y0+(H-y0)*k*k;ctx.globalAlpha=k;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.8);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.8)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function spotlight(x,y,w,a,col){ctx.save();ctx.globalAlpha=a;const g=ctx.createLinearGradient(0,0,0,y);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,col||'rgba(255,240,200,0.35)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-30,0);ctx.lineTo(x+30,0);ctx.lineTo(x+w,y);ctx.lineTo(x-w,y);ctx.closePath();ctx.fill();
  ctx.fillStyle=col||'rgba(255,240,200,0.35)';ctx.beginPath();ctx.ellipse(x,y,w,w*0.18,0,0,7);ctx.fill();ctx.restore();}

// ---------------- 3D globe
const proj=d3.geoOrthographic().clipAngle(90);const gp=d3.geoPath(proj,ctx);const grat=d3.geoGraticule10();
function globe(cam,hl,a=1){
  // cam {lon,lat,s,cx,cy,tilt}
  proj.scale(cam.s).translate([cam.cx||W/2,cam.cy||H/2]).rotate([-cam.lon,-cam.lat,cam.roll||0]);
  const cx=cam.cx||W/2,cy=cam.cy||H/2,r=cam.s;
  ctx.save();ctx.globalAlpha=a;
  const og=ctx.createRadialGradient(cx,cy,r*0.92,cx,cy,r*1.25);og.addColorStop(0,'rgba(80,170,255,0.55)');og.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(cx,cy,r*1.25,0,7);ctx.fill();
  const oc=ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.05,cx,cy,r);oc.addColorStop(0,'#1b4a86');oc.addColorStop(0.7,'#081d40');oc.addColorStop(1,'#030b1e');
  ctx.fillStyle=oc;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.beginPath();gp(grat);ctx.strokeStyle='rgba(120,190,255,0.14)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();gp(FC);ctx.fillStyle='#22406a';ctx.fill();ctx.strokeStyle='rgba(170,210,255,0.35)';ctx.lineWidth=0.8;ctx.stroke();
  // highlights
  for(const h of hl){if(h.k<=0)continue;const f=BY[h.n];
    ctx.save();ctx.globalAlpha=a*h.k;
    ctx.shadowColor=h.c;ctx.shadowBlur=35;ctx.beginPath();gp(f);ctx.fillStyle=h.c+'99';ctx.fill();
    ctx.shadowBlur=18;ctx.strokeStyle=h.c2||'#fff';ctx.lineWidth=2.6;ctx.stroke();ctx.restore();}
  // lighting / terminator
  const sh=ctx.createRadialGradient(cx-r*0.4,cy-r*0.45,r*0.1,cx,cy,r*1.02);sh.addColorStop(0,'rgba(255,255,255,0.10)');sh.addColorStop(0.6,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=sh;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(140,200,255,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  ctx.restore();
  // markers + labels (after globe so on top)
  for(const h of hl){if(h.k<=0||!h.label)continue;const f=BY[h.n];const p=proj(f.c);if(!p)continue;
    if(d3.geoDistance(f.c,[cam.lon,cam.lat])>Math.PI/2-0.05)continue;
    marker(p[0],p[1],h.c,h.k,h.t||0);if(h.lead){ctx.save();ctx.globalAlpha=h.k;ctx.strokeStyle=h.c;ctx.lineWidth=2.5;ctx.shadowColor=h.c;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+h.dx,p[1]+h.dy-30);ctx.stroke();ctx.restore();}label(h.label,p[0]+(h.dx||0),p[1]+(h.dy||-70),h.c,h.k);}
}
function marker(x,y,c,k,t){ctx.save();ctx.globalAlpha=k;
  for(let i=0;i<3;i++){const ph=((t*0.9+i/3)%1);ctx.strokeStyle=c;ctx.globalAlpha=k*(1-ph);ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,10+ph*60,(10+ph*60)*0.55,0,0,7);ctx.stroke();}
  ctx.globalAlpha=k;ctx.fillStyle='#fff';ctx.shadowColor=c;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();
  // pin
  ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y-6);ctx.bezierCurveTo(x-18,y-30,x-14,y-50,x,y-50);ctx.bezierCurveTo(x+14,y-50,x+18,y-30,x,y-6);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-36,5.5,0,7);ctx.fill();ctx.restore();}
function label(s,x,y,c,k){if(k<=0)return;ctx.save();ctx.globalAlpha=clamp(k);
  ctx.font='800 34px "Inter Display",Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(s).width+44;const sc=eback(k);ctx.translate(x,y-58);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(4,12,30,0.82)';ctx.shadowColor=c;ctx.shadowBlur=25;ctx.beginPath();ctx.roundRect(-w/2,-28,w,56,12);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle=c;ctx.fillRect(-w/2+10,24,w-20,3);
  ctx.fillStyle='#fff';ctx.fillText(s,0,1);ctx.restore();}
function arc(a,b,k,c,plane,t){ // great-circle arc on current proj
  if(k<=0)return;const ip=d3.geoInterpolate(a,b);const n=80;const m=Math.floor(n*clamp(k));
  ctx.save();ctx.strokeStyle=c;ctx.lineWidth=4;ctx.shadowColor=c;ctx.shadowBlur=18;ctx.setLineDash([16,10]);ctx.lineDashOffset=-t*60;
  ctx.beginPath();let last=null;
  for(let i=0;i<=m;i++){const g=ip(i/n);const lift=Math.sin(Math.PI*i/n)*0.12;const p=proj(g);if(!p)continue;
    const cx=proj.translate()[0],cy=proj.translate()[1];const q=[cx+(p[0]-cx)*(1+lift),cy+(p[1]-cy)*(1+lift)];
    if(i===0)ctx.moveTo(q[0],q[1]);else ctx.lineTo(q[0],q[1]);last=[q,i];}
  ctx.stroke();ctx.restore();
  if(plane&&last&&k<1){const i=last[1];const g2=ip(Math.min(1,(i+1)/n));const p2=proj(g2);const lift=Math.sin(Math.PI*(i+1)/n)*0.12;
    const cx=proj.translate()[0],cy=proj.translate()[1];const q2=p2?[cx+(p2[0]-cx)*(1+lift),cy+(p2[1]-cy)*(1+lift)]:last[0];
    const ang=Math.atan2(q2[1]-last[0][1],q2[0]-last[0][0]);planeIcon(last[0][0],last[0][1],46,'#fff',ang,c);}
}
function camAt(t,keys){ // keys [[t,{lon,lat,s}],...]
  if(t<=keys[0][0])return {...keys[0][1]};
  for(let i=0;i<keys.length-1;i++){const [t0,a]=keys[i],[t1,b]=keys[i+1];if(t<=t1){const k=eio((t-t0)/(t1-t0));
    const o={};for(const key in b)o[key]=lerp(a[key]??b[key],b[key],k);return o;}}
  return {...keys[keys.length-1][1]};
}

// ---------------- digits
function num(v,x,y,size,color,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  ctx.font=`900 ${size}px "Inter Display",Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const s=String(v);ctx.shadowColor=color;ctx.shadowBlur=size*0.4;ctx.fillStyle=color;ctx.fillText(s,x,y);
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.globalAlpha=a*0.9;ctx.fillText(s,x,y);
  ctx.globalAlpha=a;ctx.lineWidth=size*0.03;ctx.strokeStyle=color;ctx.strokeText(s,x,y);ctx.restore();}

// ---------------- characters (stylised 3D-shaded figures)
function shade(x0,y0,x1,c1,c2){const g=ctx.createLinearGradient(x0,y0,x1,y0);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function figure(x,y,s,o){ // feet at y, height ~ 2.6*s
  o=o||{};ctx.save();ctx.translate(x,y);ctx.scale(s/100,s/100);
  const suit=o.suit||'#2b3f66',suit2=o.suit2||'#16233e';
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(0,0,70,14,0,0,7);ctx.fill();
  // legs
  ctx.fillStyle=o.pants||'#1b2438';ctx.beginPath();ctx.roundRect(-30,-120,26,120,8);ctx.fill();ctx.beginPath();ctx.roundRect(4,-120,26,120,8);ctx.fill();
  ctx.fillStyle='#0b0e16';ctx.beginPath();ctx.roundRect(-36,-12,34,12,6);ctx.fill();ctx.beginPath();ctx.roundRect(2,-12,34,12,6);ctx.fill();
  // torso
  ctx.fillStyle=shade(-48,0,48,suit,suit2);ctx.beginPath();ctx.moveTo(-46,-118);ctx.lineTo(-50,-205);ctx.quadraticCurveTo(0,-232,50,-205);ctx.lineTo(46,-118);ctx.closePath();ctx.fill();
  if(o.robe){ctx.fillStyle=shade(-55,0,55,'#1a1a1a','#000');ctx.beginPath();ctx.moveTo(-55,-30);ctx.lineTo(-50,-205);ctx.quadraticCurveTo(0,-232,50,-205);ctx.lineTo(55,-30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-10,-215);ctx.lineTo(10,-215);ctx.lineTo(6,-185);ctx.lineTo(-6,-185);ctx.fill();}
  if(o.tie){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-14,-214);ctx.lineTo(14,-214);ctx.lineTo(0,-160);ctx.fill();ctx.fillStyle=o.tie;ctx.beginPath();ctx.moveTo(-5,-210);ctx.lineTo(5,-210);ctx.lineTo(8,-160);ctx.lineTo(0,-148);ctx.lineTo(-8,-160);ctx.fill();}
  if(o.vest){ctx.fillStyle='rgba(210,255,40,0.92)';ctx.fillRect(-46,-195,92,60);ctx.fillStyle='#ddd';ctx.fillRect(-46,-170,92,8);}
  // arms
  ctx.strokeStyle=o.robe?'#111':suit;ctx.lineCap='round';ctx.lineWidth=22;
  const la=o.armL??0.15,ra=o.armR??-0.15;
  ctx.beginPath();ctx.moveTo(-46,-200);ctx.lineTo(-46-Math.sin(la)*95,-200+Math.cos(la)*95);ctx.stroke();
  ctx.beginPath();ctx.moveTo(46,-200);ctx.lineTo(46-Math.sin(ra)*95,-200+Math.cos(ra)*95);ctx.stroke();
  ctx.fillStyle=C.SKIN;ctx.beginPath();ctx.arc(-46-Math.sin(la)*100,-200+Math.cos(la)*100,11,0,7);ctx.fill();ctx.beginPath();ctx.arc(46-Math.sin(ra)*100,-200+Math.cos(ra)*100,11,0,7);ctx.fill();
  o.hR=[46-Math.sin(ra)*100,-200+Math.cos(ra)*100];o.hL=[-46-Math.sin(la)*100,-200+Math.cos(la)*100];
  // neck + head
  ctx.fillStyle=C.SKIN2;ctx.fillRect(-10,-232,20,22);
  const hg=ctx.createRadialGradient(-12,-275,4,0,-262,40);hg.addColorStop(0,'#f6dcc0');hg.addColorStop(1,C.SKIN2);
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,-265,32,38,0,0,7);ctx.fill();
  // hair
  ctx.fillStyle=o.hair||'#141010';ctx.beginPath();ctx.ellipse(0,-290,33,18,0,Math.PI,0);ctx.fill();ctx.fillRect(-33,-292,8,22);ctx.fillRect(25,-292,8,22);
  if(o.wig){ctx.fillStyle='#f2f2f2';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(-34+i*11.3,-296+Math.abs(i-3)*3,12,0,7);ctx.fill();}
    for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(-36,-280+j*16,10,0,7);ctx.fill();ctx.beginPath();ctx.arc(36,-280+j*16,10,0,7);ctx.fill();}}
  if(o.cap){ctx.fillStyle='#0b1530';ctx.beginPath();ctx.roundRect(-36,-318,72,26,6);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(-40,-296,80,8);
    ctx.fillStyle='#d8dde8';ctx.beginPath();ctx.arc(0,-305,7,0,7);ctx.fill();}
  if(o.beard){ctx.fillStyle='#1a1410';ctx.beginPath();ctx.ellipse(0,-246,26,18,0,0,Math.PI);ctx.fill();}
  // face
  ctx.fillStyle='#1a1a1a';
  if(o.shades){ctx.beginPath();ctx.roundRect(-26,-276,22,12,4);ctx.fill();ctx.beginPath();ctx.roundRect(4,-276,22,12,4);ctx.fill();ctx.fillRect(-4,-273,8,3);}
  else{ctx.beginPath();ctx.arc(-11,-270,3.5,0,7);ctx.fill();ctx.beginPath();ctx.arc(11,-270,3.5,0,7);ctx.fill();}
  ctx.strokeStyle='#6b3b2a';ctx.lineWidth=3;ctx.beginPath();
  if(o.smirk){ctx.moveTo(-10,-248);ctx.quadraticCurveTo(4,-242,14,-252);}else if(o.sad){ctx.moveTo(-10,-244);ctx.quadraticCurveTo(0,-252,10,-244);}else{ctx.moveTo(-9,-249);ctx.quadraticCurveTo(0,-244,9,-249);}
  ctx.stroke();
  ctx.restore();return o;
}
// pop-up wrapper: rises + scales with overshoot, badge icon above head
function popChar(t,t0,x,y,s,o,icon,iconCol,out){
  const k=t-t0;if(k<0)return;const a=out!==undefined?clamp((out-t)/0.35):1;if(a<=0)return;
  const sc=eback(k/0.55);const dy=(1-eo(k/0.5))*120;
  ctx.save();ctx.globalAlpha=a*clamp(k/0.2);
  // glow ring on floor
  ctx.save();ctx.strokeStyle=iconCol||C.CY;ctx.lineWidth=3;ctx.shadowColor=iconCol||C.CY;ctx.shadowBlur=20;ctx.globalAlpha*=0.8;
  ctx.beginPath();ctx.ellipse(x,y,s*0.9*clamp(k/0.4),s*0.2*clamp(k/0.4),0,0,7);ctx.stroke();ctx.restore();
  ctx.translate(x,y+dy);ctx.scale(sc,sc);figure(0,0,s,o);
  if(icon){const bk=t-t0-0.35;if(bk>0){const bs=eback(bk/0.5);const by=-4.05*s+Math.sin(t*3)*5;
    ctx.save();ctx.translate(0,by);ctx.scale(bs,bs);badge(icon,iconCol||C.CY,s*0.62,t);ctx.restore();}}
  ctx.restore();
}
function badge(icon,c,r,t){
  ctx.save();ctx.shadowColor=c;ctx.shadowBlur=30;ctx.fillStyle='rgba(6,14,34,0.92)';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.shadowBlur=15;ctx.strokeStyle=c;ctx.lineWidth=4;ctx.stroke();ctx.shadowBlur=0;
  ctx.beginPath();ctx.moveTo(-12,r-4);ctx.lineTo(0,r+16);ctx.lineTo(12,r-4);ctx.fillStyle=c;ctx.fill();
  ICON[icon](0,0,r*1.15,c,t);ctx.restore();
}

// ---------------- icons (centered at x,y, size ~ s)
const ICON={
 suitcase(x,y,s,c){ctx.save();ctx.translate(x,y);const u=s/100;ctx.scale(u,u);ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-40,-24,80,56,8);ctx.fill();
   ctx.strokeStyle=c;ctx.lineWidth=7;ctx.beginPath();ctx.roundRect(-14,-38,28,18,5);ctx.stroke();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(-40,-2,80,6);ctx.fillRect(-20,-24,6,56);ctx.fillRect(14,-24,6,56);ctx.restore();},
 rings(x,y,s,c){ctx.save();ctx.translate(x,y);const u=s/100;ctx.scale(u,u);ctx.strokeStyle=c;ctx.lineWidth=8;ctx.shadowColor=c;ctx.shadowBlur=10;
   ctx.beginPath();ctx.arc(-15,8,24,0,7);ctx.stroke();ctx.beginPath();ctx.arc(15,8,24,0,7);ctx.stroke();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-15,-16);ctx.lineTo(-24,-28);ctx.lineTo(-6,-28);ctx.fill();ctx.restore();},
 masks(x,y,s,c){ctx.save();ctx.translate(x,y);const u=s/100;ctx.scale(u,u);
   const m=(dx,rot,happy,col)=>{ctx.save();ctx.translate(dx,0);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-24,-28);ctx.quadraticCurveTo(0,-36,24,-28);ctx.quadraticCurveTo(26,20,0,34);ctx.quadraticCurveTo(-26,20,-24,-28);ctx.fill();
     ctx.fillStyle='#0a1022';ctx.beginPath();ctx.ellipse(-10,-10,6,4,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(10,-10,6,4,0,0,7);ctx.fill();
     ctx.strokeStyle='#0a1022';ctx.lineWidth=4;ctx.beginPath();if(happy){ctx.arc(0,6,11,0.2,Math.PI-0.2);}else{ctx.arc(0,20,11,Math.PI+0.2,-0.2);}ctx.stroke();ctx.restore();};
   m(-14,-0.25,false,'#bcd0ff');m(14,0.25,true,c);ctx.restore();},
 shield(x,y,s,c){ctx.save();ctx.translate(x,y);const u=s/100;ctx.scale(u,u);ctx.fillStyle='#e8eefc';ctx.beginPath();ctx.roundRect(-30,-38,52,70,5);ctx.fill();
   ctx.fillStyle='#8aa0c8';for(let i=0;i<5;i++)ctx.fillRect(-22,-26+i*11,36-(i%2)*10,4);
   ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(20,-6);ctx.lineTo(42,2);ctx.quadraticCurveTo(42,30,20,42);ctx.quadraticCurveTo(-2,30,-2,2);ctx.closePath();ctx.fill();
   ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(10,16);ctx.lineTo(18,24);ctx.lineTo(32,8);ctx.stroke();ctx.restore();},
 warn(x,y,s,c){ctx.save();ctx.translate(x,y);const u=s/100;ctx.scale(u,u);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(40,32);ctx.lineTo(-40,32);ctx.closePath();ctx.fill();
   ctx.fillStyle='#0a1022';ctx.beginPath();ctx.roundRect(-5,-14,10,28,4);ctx.fill();ctx.beginPath();ctx.arc(0,23,5.5,0,7);ctx.fill();ctx.restore();},
 gavel(x,y,s,c,t){ctx.save();ctx.translate(x,y);const u=s/100;ctx.scale(u,u);const sw=Math.max(0,Math.sin(t*6))*0.5;ctx.rotate(-0.6+sw);
   ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-30,-30,60,26,6);ctx.fill();ctx.fillStyle='#8a5a2b';ctx.fillRect(-5,-6,10,46);ctx.restore();
   ctx.save();ctx.translate(x,y);ctx.scale(s/100,s/100);ctx.fillStyle=c;ctx.fillRect(-28,32,56,8);ctx.restore();},
 briefcase(x,y,s,c){ctx.save();ctx.translate(x,y);const u=s/100;ctx.scale(u,u);ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-38,-18,76,50,8);ctx.fill();

const SC=[[0,9,scene1],[9,17,scene2],[17,25,scene3],[25,35,scene4],[35,46,scene5],[46,53,scene6],[53,60,scene7]];
