<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W=1920,H=1280;
const R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H,false);R.setPixelRatio(1);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const ov=document.getElementById('ov').getContext('2d');

// ---------------- utils
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-clamp(k),3);
const eio=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const eback=k=>{k=clamp(k);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const ramp=(t,a,d)=>clamp((t-a)/d);
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const M=(c,r=0.6,m=0,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o));
function mesh(geo,mat,x=0,y=0,z=0,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
const BOX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CYL=(rt,rb,h,s=20)=>new THREE.CylinderGeometry(rt,rb,h,s);
const SPH=(r,ws=24,hs=16)=>new THREE.SphereGeometry(r,ws,hs);

let K,TEMPO,LEAD,PAK,END;
const tv=k=>LEAD+K[k]/TEMPO;

// ---------------- textures
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
function starPath(g,x,y,r,rot){g.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2;const rr=i%2?r*0.4:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();}
const TEX={};
function makeTextures(){
  TEX.pk=canvasTex(600,400,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='#01411C';g.fillRect(150,0,450,400);
    const cx=375,cy=200;g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,120,0,7);g.fill();g.fillStyle='#01411C';g.beginPath();g.arc(cx+38,cy-30,105,0,7);g.fill();
    g.fillStyle='#fff';starPath(g,cx+60,cy-50,40,-0.6);g.fill();});
  TEX.ppp=canvasTex(300,200,(g,w,h)=>{g.fillStyle='#c8102e';g.fillRect(0,0,w,h/3);g.fillStyle='#111';g.fillRect(0,h/3,w,h/3);g.fillStyle='#0a7a2f';g.fillRect(0,2*h/3,w,h/3);});
  TEX.tile=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#b9b2a3';g.fillRect(0,0,w,h);for(let i=0;i<8;i++)for(let j=0;j<8;j++){g.fillStyle=`hsl(40,10%,${62+rnd(i*9+j)*10}%)`;g.fillRect(i*64+1,j*64+1,62,62);}});
  TEX.tile.wrapS=TEX.tile.wrapT=THREE.RepeatWrapping;TEX.tile.repeat.set(30,30);
  TEX.camo=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#5b5a3a';g.fillRect(0,0,w,h);const cs=['#3d3f28','#7a6f48','#2e2a1f','#6b6e45'];for(let i=0;i<70;i++){g.fillStyle=cs[i%4];g.beginPath();g.ellipse(rnd(i)*w,rnd(i+50)*h,8+rnd(i+9)*26,5+rnd(i+3)*14,rnd(i+7)*3,0,7);g.fill();}});
  TEX.brick=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#3b2a24';g.fillRect(0,0,w,h);for(let j=0;j<32;j++)for(let i=0;i<9;i++){g.fillStyle=`hsl(12,${25+rnd(i+j*9)*15}%,${22+rnd(i*3+j)*10}%)`;g.fillRect(i*60+(j%2)*30-30,j*16+1,57,14);}});
  TEX.brick.wrapS=TEX.brick.wrapT=THREE.RepeatWrapping;
  TEX.curtain=canvasTex(512,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,0);for(let i=0;i<=16;i++){gr.addColorStop(i/16,i%2?'#4a0a10':'#7a1620');}g.fillStyle=gr;g.fillRect(0,0,w,h);});
}

// ---------------- environment helpers
function skyDome(scene,top,mid,bot){
  const geo=new THREE.SphereGeometry(400,32,16);const col=[];const p=geo.attributes.position;
  const ct=new THREE.Color(top),cm=new THREE.Color(mid),cb=new THREE.Color(bot);
  for(let i=0;i<p.count;i++){const y=p.getY(i)/400;const c=y>0.05?cm.clone().lerp(ct,clamp((y-0.05)/0.6)):cb.clone().lerp(cm,clamp((y+0.2)/0.25));col.push(c.r,c.g,c.b);}
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));scene.add(m);return m;
}
function stars(scene,n=900,r=380){const g=new THREE.BufferGeometry();const a=[];for(let i=0;i<n;i++){const th=rnd(i)*Math.PI*2,ph=Math.acos(rnd(i+3000)*0.95);a.push(r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th));}
  g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xcfe0ff,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:0.9}));scene.add(p);return p;}
function ground(scene,color,tex,size=400){const m=M(color,0.85);if(tex){m.map=tex;}const g=mesh(new THREE.PlaneGeometry(size,size),m);g.rotation.x=-Math.PI/2;g.castShadow=false;scene.add(g);return g;}
function sun(scene,color,int,pos,size=30){const d=new THREE.DirectionalLight(color,int);d.position.copy(pos);d.castShadow=true;d.shadow.mapSize.set(2048,2048);const c=d.shadow.camera;c.left=-size;c.right=size;c.top=size;c.bottom=-size;c.near=1;c.far=200;d.shadow.bias=-0.0005;d.shadow.normalBias=0.02;scene.add(d);scene.add(d.target);return d;}
function glowSprite(color,size){const t=canvasTex(128,128,(g)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.25,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));s.scale.set(size,size,1);return s;}
function beam(color,len,r,op=0.12){const g=new THREE.ConeGeometry(r,len,24,1,true);g.translate(0,-len/2,0);const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));return m;}

// flag: returns {group, update(t)}
function flag(tex,w=3,h=2,pole=7,poleCol=0xd8d8d8){
  const g=new THREE.Group();mesh(CYL(0.06,0.08,pole),M(poleCol,0.3,0.8),0,pole/2,0,g);mesh(SPH(0.12),M(0xd4af37,0.3,0.9),0,pole+0.05,0,g);
  const geo=new THREE.PlaneGeometry(w,h,24,12);geo.translate(w/2,0,0);const base=geo.attributes.position.array.slice();
  const fm=mesh(geo,new THREE.MeshStandardMaterial({map:tex,side:THREE.DoubleSide,roughness:0.8}),0.06,pole-h/2-0.1,0,g);
  const ph=Math.random()*10;
  return {group:g,update(t){const p=geo.attributes.position;for(let i=0;i<p.count;i++){const x=base[i*3],y=base[i*3+1];const k=x/w;p.setZ(i,Math.sin(x*2.2-t*6+ph+y*0.6)*0.22*k+Math.sin(x*4.1-t*9)*0.05*k);p.setY(i,y-k*k*0.15);}p.needsUpdate=true;geo.computeVertexNormals();}};
}

// ---------------- characters
const SKIN=0xc68e65,SKIN2=0xb07a55,KHAKI=0x8d7a4f,KHAKI2=0x7b6a42;
function figure(o){
  o=Object.assign({skin:SKIN,top:'kameez',topColor:0xeeeeee,pants:null,cap:null,capColor:0x222222,hair:0x1a1410,mustache:false,glasses:false,brows:1,scale:1,bald:false,waistcoat:null,build:1},o);
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const skin=M(o.skin,0.55),top=M(o.topColor,0.7),pants=M(o.pants??o.topColor,0.75),dark=M(0x111111,0.5);
  if(o.top==='uniform'&&o.camo){top.map=TEX.camo;pants.map=TEX.camo;top.color.set(0xffffff);pants.color.set(0xffffff);}
  const bw=o.build;
  // legs
  const legs=[];for(const s of[-1,1]){const lg=new THREE.Group();lg.position.set(0.1*s*bw,0.92,0);body.add(lg);
    mesh(CYL(0.075*bw,0.065,0.86,12),pants,0,-0.43,0,lg);mesh(BOX(0.13,0.08,0.26),dark,0,-0.88,0.05,lg);legs.push(lg);}
  // torso
  const long=(o.top==='kameez'||o.top==='sherwani'||o.top==='kurta');
  const prof=long?[[0.0,0.55],[0.27,0.55],[0.235,0.8],[0.19,1.0],[0.215,1.2],[0.235,1.34],[0.215,1.45],[0.14,1.53],[0.06,1.57],[0.0,1.57]]
                 :[[0.0,0.84],[0.2,0.84],[0.19,1.0],[0.215,1.2],[0.235,1.34],[0.215,1.45],[0.14,1.53],[0.06,1.57],[0.0,1.57]];
  const lg=new THREE.LatheGeometry(prof.map(([r,y])=>new THREE.Vector2(r*bw,y)),28);const tm=mesh(lg,top,0,0,0,body);tm.scale.z=0.72;
  if(!long){const pv=mesh(CYL(0.185*bw,0.16*bw,0.16,24),pants,0,0.86,0,body);pv.scale.z=0.75;}
  const sh=mesh(SPH(0.24*bw,24,12),top,0,1.44,0,body);sh.scale.set(1,0.38,0.62); // shoulders
  if(o.top==='suit'||o.top==='uniform'){ // lapels / tie
    if(o.top==='suit'){mesh(BOX(0.06,0.4,0.02),M(o.tie??0x7a1020,0.5),0,1.28,0.2*bw,body);mesh(BOX(0.16,0.2,0.02),M(0xf2f2f2,0.6),0,1.42,0.185*bw,body);}
    if(o.top==='uniform'){
      mesh(CYL(0.205*bw,0.205*bw,0.07,24),M(0x4a3020,0.4),0,0.97,0,body); // belt
      mesh(BOX(0.05,0.03,0.02),M(0xd4af37,0.3,0.9),0,0.97,0.205*bw,body);
      const sb=mesh(BOX(0.045,0.75,0.02),M(0x4a3020,0.4),0.02,1.22,0.19*bw,body);sb.rotation.z=0.5;
      for(const s of[-1,1]){mesh(BOX(0.13,0.025,0.16),M(o.topColor,0.6),0.2*s*bw,1.53,0,body);mesh(SPH(0.02),M(0xd4af37,0.3,0.9),0.24*s*bw,1.55,0.03,body);}
      for(const s of[-1,1])mesh(BOX(0.05,0.07,0.015),M(0xb01020,0.5),0.07*s,1.52,0.13,body); // gorget patches
      const rc=[0xb01020,0x1d6b2f,0xd4af37,0x2040a0,0xffffff];for(let i=0;i<(o.medals??6);i++)mesh(BOX(0.035,0.018,0.015),M(rc[i%5],0.5),-0.13+((i%3)*0.038),1.36-Math.floor(i/3)*0.022,0.2*bw,body);
      for(let i=0;i<4;i++)mesh(SPH(0.012),M(0xd4af37,0.3,0.9),0,1.38-i*0.11,0.21*bw,body);
    }
  }
  if(o.top==='kameez'||o.top==='sherwani'){for(let i=0;i<(o.top==='sherwani'?7:3);i++)mesh(SPH(0.012),M(o.top==='sherwani'?0xd4af37:0xdddddd,0.3,0.6),0,1.47-i*0.07,0.23*bw-0.02+i*0.002,body);
    if(o.top==='sherwani')mesh(CYL(0.075,0.08,0.06,16),top,0,1.57,0,body);}
  if(o.waistcoat){mesh(CYL(0.225*bw,0.235*bw,0.5,24,1,true),M(o.waistcoat,0.7),0,1.2,0,body);}
  if(o.dupatta){const d=mesh(CYL(0.25,0.33,0.9,24,1,true),M(o.dupatta,0.85,0,{side:THREE.DoubleSide}),0,1.12,-0.04,body);d.scale.z=0.9;}
  // arms
  const arms=[],fore=[];
  for(const s of[-1,1]){const a=new THREE.Group();a.position.set(0.27*s*bw,1.44,0);body.add(a);
    mesh(CYL(0.058,0.05,0.34,12),top,0,-0.17,0,a);mesh(SPH(0.06,12,8),top,0,0,0,a);const f=new THREE.Group();f.position.set(0,-0.34,0);a.add(f);
    mesh(CYL(0.05,0.044,0.3,12),top,0,-0.15,0,f);mesh(SPH(0.05,10,8),top,0,0,0,f);mesh(SPH(0.052,12,8),skin,0,-0.33,0,f);a.rotation.z=0.08*s;arms.push(a);fore.push(f);}
  // head
  const head=new THREE.Group();head.position.set(0,1.6,0);body.add(head);
  mesh(CYL(0.05,0.06,0.1,12),o.top==='sherwani'?top:skin,0,-0.02,0,head);
  const hd=mesh(SPH(0.125,32,20),skin,0,0.12,0,head);hd.scale.set(0.92,1.1,0.98);
  mesh(SPH(0.03,10,8),skin,-0.118,0.12,0,head);mesh(SPH(0.03,10,8),skin,0.118,0.12,0,head); // ears
  const nose=mesh(new THREE.ConeGeometry(0.022,0.06,10),skin,0,0.1,0.13,head);nose.rotation.x=Math.PI/2;
  const eyeM=M(0x0d0b09,0.2);for(const s of[-1,1]){mesh(SPH(0.016,10,8),M(0xf4f0ea,0.3),0.045*s,0.14,0.105,head);mesh(SPH(0.01,8,6),eyeM,0.045*s,0.14,0.118,head);
    const br=mesh(BOX(0.05,0.012*o.brows,0.015),M(o.hair,0.8),0.047*s,0.175,0.11,head);br.rotation.z=-0.12*s;}
  mesh(BOX(0.05,0.008,0.01),M(0x7a3a30,0.6),0,0.045,0.118,head); // lips
  if(o.mustache){const mm=mesh(BOX(o.mustache===2?0.085:0.06,0.016,0.022),M(o.mHair??o.hair,0.9),0,0.068,0.118,head);}
  if(o.glasses){const gm=M(0x111111,0.3,0.6);for(const s of[-1,1]){const r=mesh(new THREE.TorusGeometry(0.027,0.004,6,20),gm,0.046*s,0.14,0.122,head);}mesh(BOX(0.03,0.004,0.004),gm,0,0.142,0.124,head);}
  if(!o.bald||o.cap){const h=mesh(SPH(0.132,24,12,),M(o.hair,0.9),0,0.15,-0.012,head);h.scale.set(0.95,o.bald?0.6:0.9,1);h.geometry=new THREE.SphereGeometry(0.132,24,12,0,Math.PI*2,0,Math.PI*0.52);h.rotation.x=-0.25;}
  else{const h=mesh(new THREE.SphereGeometry(0.133,24,12,0,Math.PI*2,Math.PI*0.35,0.25),M(o.hair,0.9),0,0.12,-0.01,head);h.rotation.x=-0.6;}
  const capM=M(o.capColor,0.6);
  if(o.cap==='karakul'){const c=mesh(CYL(0.12,0.128,0.12,24),capM,0,0.26,-0.01,head);c.scale.z=0.82;mesh(BOX(0.012,0.02,0.2),M(0x111111,0.9),0,0.325,-0.01,head);}
  if(o.cap==='peaked'){mesh(CYL(0.128,0.13,0.06,24),M(o.band??0xb01020,0.6),0,0.25,0,head);const cr=mesh(CYL(0.165,0.13,0.07,28),capM,0,0.31,-0.01,head);cr.rotation.x=-0.08;
    const vz=mesh(new THREE.CylinderGeometry(0.13,0.13,0.012,24,1,false,-Math.PI/2,Math.PI),M(0x0a0a0a,0.2,0.3),0,0.225,0.03,head);vz.rotation.x=0.25;vz.scale.z=0.8;
    mesh(SPH(0.022,10,8),M(0xd4af37,0.25,1),0,0.29,0.14,head);const gb=mesh(BOX(0.18,0.012,0.01),M(0xd4af37,0.3,0.9),0,0.24,0.13,head);}
  if(o.cap==='beret'){const b=mesh(SPH(0.15,24,12),capM,0.03,0.25,-0.01,head);b.scale.set(1.05,0.35,1);b.rotation.z=-0.25;mesh(SPH(0.02,8,8),M(0xd4af37,0.3,1),-0.08,0.25,0.11,head);}
  if(o.cap==='hat'){mesh(CYL(0.2,0.2,0.012,28),capM,0,0.24,0,head);mesh(CYL(0.11,0.125,0.12,24),capM,0,0.31,0,head);mesh(CYL(0.126,0.126,0.025,24),M(0x111111,0.5),0,0.265,0,head);}
  if(o.cap==='dupatta'){const d=mesh(new THREE.SphereGeometry(0.15,24,14,0,Math.PI*2,0,Math.PI*0.62),M(o.dupatta,0.85,0,{side:THREE.DoubleSide}),0,0.13,-0.02,head);d.rotation.x=-0.35;d.scale.set(1,1.1,1.05);}
  g.scale.setScalar(o.scale);
  return {g,body,arms,fore,legs,head};
}
// poses
function idle(f,t,ph=0,amp=1){f.body.position.y=Math.sin(t*2+ph)*0.006*amp;f.head.rotation.y=Math.sin(t*0.7+ph)*0.12*amp;f.head.rotation.x=Math.sin(t*0.9+ph)*0.03;
  f.arms[0].rotation.x=Math.sin(t*1.1+ph)*0.04;f.arms[1].rotation.x=Math.sin(t*1.3+ph)*0.04;}
function walk(f,t,sp=6,amp=0.5){const s=Math.sin(t*sp);f.legs[0].rotation.x=s*amp;f.legs[1].rotation.x=-s*amp;f.arms[0].rotation.x=-s*amp*0.7;f.arms[1].rotation.x=s*amp*0.7;f.body.position.y=Math.abs(Math.cos(t*sp))*0.03;}
function wave(f,t,k=1,side=1){const a=f.arms[side];a.rotation.z=lerp(a.rotation.z,(side?1:-1)*2.5,k);a.rotation.x=lerp(0,-0.2,k);f.fore[side].rotation.z=lerp(0,(side?-1:1)*(0.3+Math.sin(t*7)*0.35),k);}
function fist(f,t,k=1,side=1){const a=f.arms[side];a.rotation.z=(side?1:-1)*lerp(0.08,2.9,k);f.fore[side].rotation.z=(side?-1:1)*lerp(0,0.2+Math.sin(t*5)*0.15,k);}
function salute(f,k=1){const a=f.arms[1];a.rotation.z=lerp(0.08,1.2,k);a.rotation.x=lerp(0,-0.25,k);f.fore[1].rotation.z=lerp(0,2.5,k);f.fore[1].rotation.x=0;}
function point(f,k=1,side=1){const a=f.arms[side];a.rotation.x=lerp(0,-1.5,k);a.rotation.z=(side?1:-1)*lerp(0.08,0.25,k);}

const LEADERS={
 liaquat:()=>figure({top:'sherwani',topColor:0x1d1c22,pants:0xd6d0c2,cap:'karakul',capColor:0x2b2b2e,glasses:true,mustache:1,hair:0x222222,build:1.08}),
 ayub:()=>figure({top:'uniform',topColor:KHAKI,cap:'peaked',capColor:KHAKI2,mustache:2,hair:0x2a241e,scale:1.06,medals:9}),
 yahya:()=>figure({top:'uniform',topColor:KHAKI2,cap:'peaked',capColor:0x6d5d3a,brows:2.6,hair:0x1a1a1a,build:1.12,medals:9}),
 zab:()=>figure({top:'kameez',topColor:0x9a9a96,pants:0x9a9a96,hair:0x101010,skin:0xc89670}),

    gg.position.set(-2.2,pg.scale.y+0.3,3);rg.position.set(2.2,pr.scale.y+0.3,3);
    const pu33=Math.max(0,1-Math.abs(lt-(tv('f_33')-t0+0.4))/0.8),pu46=Math.max(0,1-Math.abs(lt-(tv('f_46')-t0+0.4))/0.8);rM.emissiveIntensity=0.9+pu33*2;gM.emissiveIntensity=0.9+pu46*2;
    const kk=eo((lt-(tv('khaki')-t0))/1.2);cap.position.set(7,lerp(30,12.5,kk),-7);cap.rotation.y=t*0.2;cap.visible=kk>0.001;
    const p=lt/(END-t0);const a=0.35-p*0.5,r=lerp(31,28,p);cam(c,V(Math.sin(a)*r,lerp(9,8,p)+kk*2,Math.cos(a)*r),V(0,lerp(7,7.5,p)+kk*1.5,0),40);
    c.updateMatrixWorld();const pj=(x,y,z)=>{const v=V(x,y,z).project(c);return[(v.x+1)/2*W,(1-v.y)/2*H];};this.anch={g:pj(-2.2,pg.scale.y+1.2,3),r:pj(2.2,pr.scale.y+1.2,3)};}};}

// ---------------- overlay (digits + counters only)
const CIV='#14d27a',CIV2='#0a8f52',MIL='#e0233a',MIL2='#8b0a1a';
let YEARS=[],CEV=[],MEV=[],SEG=[];
function valAt(ev,t){let v=0;for(const [k,d,dt,du] of ev){const s=tv(k)+(dt||0);v+=d*(du?eio((t-s)/du):eo((t-s)/1.4));}return v;}
function digits(s,x,y,size,color,a,glow=1,align='center'){if(a<=0)return;ov.save();ov.globalAlpha=a;ov.font=`900 ${size}px "Inter Display", Inter, sans-serif`;ov.textAlign=align;ov.textBaseline='middle';
  ov.shadowColor=color;ov.shadowBlur=size*0.4*glow;ov.fillStyle=color;ov.fillText(s,x,y);ov.shadowBlur=0;
  const g=ov.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,'#ffffff');g.addColorStop(0.55,'#f2f2f2');g.addColorStop(1,'#bdbdbd');ov.fillStyle=g;ov.globalAlpha=a*0.95;ov.fillText(s,x,y);
  ov.lineWidth=Math.max(2,size*0.018);ov.strokeStyle=color;ov.globalAlpha=a;ov.strokeText(s,x,y);ov.restore();}
function rrect(x,y,w,h,r){ov.beginPath();ov.roundRect(x,y,w,h,r);}
function iconBallot(x,y,s,col){ov.save();ov.translate(x,y);ov.strokeStyle=col;ov.fillStyle=col;ov.lineWidth=3;ov.lineJoin='round';
  ov.beginPath();ov.moveTo(-s*0.18,-s*0.55);ov.lineTo(s*0.22,-s*0.55);ov.lineTo(s*0.22,-s*0.05);ov.lineTo(-s*0.18,-s*0.05);ov.closePath();ov.globalAlpha=0.9;ov.fillStyle='#fff';ov.fill();ov.globalAlpha=1;ov.stroke();
  rrect(-s*0.5,-s*0.15,s,s*0.65,4);ov.fillStyle=col;ov.fill();ov.fillStyle='rgba(0,0,0,0.5)';ov.fillRect(-s*0.3,-s*0.15,s*0.6,s*0.07);ov.restore();}
function iconStar(x,y,s,col){ov.save();ov.translate(x,y);ov.fillStyle=col;for(let i=0;i<3;i++){ov.beginPath();ov.moveTo(-s*0.5,s*(0.05+i*0.2));ov.lineTo(0,s*(-0.15+i*0.2));ov.lineTo(s*0.5,s*(0.05+i*0.2));ov.lineTo(s*0.5,s*(0.15+i*0.2));ov.lineTo(0,s*(-0.05+i*0.2));ov.lineTo(-s*0.5,s*(0.15+i*0.2));ov.closePath();ov.fill();}
  ov.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2;const r=i%2?s*0.12:s*0.3;ov.lineTo(Math.cos(a)*r,-s*0.42+Math.sin(a)*r);}ov.closePath();ov.fill();ov.restore();}
function panel(x,y,w,h,col,col2,val,k,pulse,icon){
  ov.save();const g=ov.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'rgba(8,12,20,0.78)');g.addColorStop(1,'rgba(4,6,10,0.62)');ov.fillStyle=g;rrect(x,y,w,h,18);ov.fill();
  ov.shadowColor=col;ov.shadowBlur=18+pulse*40;ov.strokeStyle=col;ov.lineWidth=2.5+pulse*2;rrect(x,y,w,h,18);ov.stroke();ov.shadowBlur=0;
  ov.fillStyle=col;rrect(x,y+16,8,h-32,4);ov.fill();
  // ring gauge
  const cx=x+74,cy=y+h/2,r=46;ov.lineWidth=10;ov.strokeStyle='rgba(255,255,255,0.08)';ov.beginPath();ov.arc(cx,cy,r,0,7);ov.stroke();
  ov.strokeStyle=col;ov.shadowColor=col;ov.shadowBlur=14;ov.lineCap='round';ov.beginPath();ov.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(k)+0.0001);ov.stroke();ov.shadowBlur=0;
  icon(cx,cy+6,40,col);ov.restore();
  const sc=1+pulse*0.12;ov.save();ov.translate(x+w-30,y+h/2+4);ov.scale(sc,sc);digits(String(Math.round(val)),0,0,96,col,1,0.8,'right');ov.restore();
}
let noise=null;
function makeNoise(){noise=document.createElement('canvas');noise.width=512;noise.height=512;const g=noise.getContext('2d');const id=g.createImageData(512,512);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);}
function drawOverlay(t,flash){ov.clearRect(0,0,W,H);
  // vignette
  const vg=ov.createRadialGradient(W/2,H/2,H*0.38,W/2,H/2,H*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');ov.fillStyle=vg;ov.fillRect(0,0,W,H);
  // years
  for(const [k,str,dx,dy,dur] of YEARS){const s=tv(k)-0.1,lt=t-s,d=dur||2.6;if(lt<0||lt>d)continue;const a=clamp(lt/0.2)*clamp((d-lt)/0.4);const sc=lerp(1.35,1,eback(lt/0.5));
    ov.save();ov.translate(W*0.40+(dx||0),H*0.5+(dy||0));ov.scale(sc,sc);
    const lg=ov.createLinearGradient(-420,0,420,0);lg.addColorStop(0,'rgba(0,0,0,0)');lg.addColorStop(0.5,'rgba(0,0,0,0.45)');lg.addColorStop(1,'rgba(0,0,0,0)');ov.globalAlpha=a;ov.fillStyle=lg;ov.fillRect(-460,-120,920,240);ov.globalAlpha=1;
    ov.globalAlpha=a*0.9;ov.fillStyle='#f5d27a';ov.fillRect(-330*eo(lt/0.6),96,660*eo(lt/0.6),5);ov.fillRect(-330*eo(lt/0.6),-104,660*eo(lt/0.6),5);ov.restore();
    ov.save();ov.translate(W*0.40+(dx||0),H*0.5+(dy||0));ov.scale(sc,sc);digits(str,0,0,210,'#f5c04a',a,1);ov.restore();}
  // counters (permanent, right side)
  const ca=clamp((t-0.6)/0.8);if(ca>0){ov.save();ov.globalAlpha=ca;const cv=valAt(CEV,t),mv=valAt(MEV,t);
    const pc=CEV.reduce((m,[k,d,dt])=>Math.max(m,Math.max(0,1-Math.abs(t-(tv(k)+(dt||0)+1.4))/0.35)),0),pm=MEV.reduce((m,[k,d,dt])=>Math.max(m,Math.max(0,1-Math.abs(t-(tv(k)+(dt||0)+1.4))/0.35)),0);
    const fp=(k)=>Math.max(0,1-Math.abs(t-tv(k)-0.4)/0.6);
    const x0=W-470+lerp(80,0,eo(ca));panel(x0,H*0.30,430,180,CIV,CIV2,cv,cv/79,Math.max(pc,fp('f_46')),iconBallot);panel(x0,H*0.30+210,430,180,MIL,MIL2,mv,mv/79,Math.max(pm,fp('f_33')),iconStar);ov.restore();}
  // bottom era timeline 1947..2026
  if(ca>0){const x=120,y=H-92,w=W-240,h=16;ov.save();ov.globalAlpha=ca*0.95;ov.fillStyle='rgba(255,255,255,0.08)';rrect(x,y,w,h,8);ov.fill();
    for(const [k,y0,y1,mil] of SEG){const p=eo((t-tv(k))/1.4);if(p<=0)continue;const a=x+(y0-1947)/79*w,b=x+(y1-1947)/79*w;ov.fillStyle=mil?MIL:CIV;ov.shadowColor=ov.fillStyle;ov.shadowBlur=12;ov.fillRect(a,y,(b-a)*p,h);}
    ov.shadowBlur=0;const yrs=[1947,1958,1971,1977,1988,1999,2008,2026];for(const yv of yrs){const xx=x+(yv-1947)/79*w;ov.fillStyle='rgba(255,255,255,0.6)';ov.fillRect(xx-1,y-6,2,h+12);}
    ov.font='700 22px Inter, sans-serif';ov.textAlign='center';ov.fillStyle='rgba(255,255,255,0.75)';ov.fillText('1947',x,y+46);ov.fillText('2026',x+w,y+46);
    const tc=Math.min(1,Math.max(0,(t-tv('s1'))/(tv('s7_2026')+1-tv('s1'))));ov.restore();}
  // finale totals
  const f79=tv('f_79');if(t>f79-0.1){const lt=t-f79;const a=clamp(lt/0.3);const sc=lerp(1.5,1,eback(lt/0.6));ov.save();ov.translate(W*0.42,H*0.12);ov.scale(sc,sc);digits('79',0,0,150,'#f5c04a',a);ov.restore();
    const an=(cur&&cur.obj&&cur.obj.anch)||{g:[W*0.3,H*0.5],r:[W*0.5,H*0.5]};if(t>tv('f_33')){const l2=t-tv('f_33');ov.save();ov.translate(an.r[0],an.r[1]-60);ov.scale(lerp(1.4,1,eback(l2/0.5)),lerp(1.4,1,eback(l2/0.5)));digits('33',0,0,150,MIL,clamp(l2/0.3));ov.restore();}
    if(t>tv('f_46')){const l2=t-tv('f_46');ov.save();ov.translate(an.g[0],an.g[1]-60);ov.scale(lerp(1.4,1,eback(l2/0.5)),lerp(1.4,1,eback(l2/0.5)));digits('46',0,0,150,CIV,clamp(l2/0.3));ov.restore();}}
  // flash / dips
  if(flash>0){ov.fillStyle=`rgba(255,250,240,${flash})`;ov.fillRect(0,0,W,H);}
  // grain
  ov.save();ov.globalAlpha=0.045;ov.globalCompositeOperation='overlay';const ox=Math.floor(rnd(Math.floor(t*30))*512),oy=Math.floor(rnd(Math.floor(t*30)+7)*512);ov.translate(-ox,-oy);ov.fillStyle=ov.createPattern(noise,'repeat');ov.fillRect(ox,oy,W,H);ov.restore();
}

// ---------------- main
let composer,rp,bloom;
window.init=(k,pak,tempo,lead,end)=>{K=k;PAK=pak;TEMPO=tempo;LEAD=lead;END=end;makeTextures();makeNoise();
  YEARS=[['q_1947','1947',-260,0,1.9],['q_2026','2026',260,0,2.6],['s1_1947','1947'],['s2_1958','1958'],['s5','1977'],['s6_1999','1999'],['s7_2026','2026']];
  // cumulative counter events: [key, years, offset]
  CEV=[['liaq_4',4],['boat_k',7],['bhutto_4',5.5],['lolly',11,-1.2],['gilani',18,0,(K.s7_2026-K.gilani)/TEMPO+0.6]];
  MEV=[['ayub_10',10+8/12],['yahya_2',2+8/12],['zia_11',11],['mush_8',8+11/12]];
  SEG=[['s1_1947',1947,1958,0],['ayub_10',1958,1969,1],['yahya_2',1969,1971,1],['bhutto_4',1971,1977,0],['zia_11',1977,1988,1],['lolly',1988,1999,0],['mush_8',1999,2008,1],['gilani',2008,2026,0]];
  addScene('intro',0,tv('s1'),buildIntro);addScene('liaquat',tv('s1'),tv('boat'),buildLiaquat);addScene('boat',tv('boat'),tv('s2'),buildBoat);
  addScene('ayub',tv('s2'),tv('s3'),buildAyub);addScene('yahya',tv('s3'),tv('s4'),buildYahya);addScene('rally',tv('s4'),tv('s5'),buildRally);
  addScene('zia',tv('s5'),tv('claw'),buildZia);addScene('claw',tv('claw'),tv('s6'),buildClaw);addScene('turn',tv('s6'),tv('s6_1999'),buildTurn);
  addScene('mush',tv('s6_1999'),tv('s7'),buildMush);addScene('puppet',tv('s7'),tv('s8'),buildPuppet);addScene('finale',tv('s8'),1e9,buildFinale);
  composer=new EffectComposer(R);rp=new RenderPass(new THREE.Scene(),camera());composer.addPass(rp);bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),0.32,0.4,0.93);composer.addPass(bloom);composer.addPass(new OutputPass());
  return SC.map(s=>[s.name,s.a,s.b]);
};
window.render=(t)=>{const sc=SC.find(s=>t>=s.a&&t<s.b)||SC[SC.length-1];
  if(cur!==sc){if(cur&&cur.obj){cur.obj.s.traverse(o=>{if(o.geometry)o.geometry.dispose();});cur.obj=null;}sc.obj=sc.build();cur=sc;}
  const lt=t-sc.a;sc.obj.update(t,lt);
  rp.scene=sc.obj.s;rp.camera=sc.obj.c;composer.render();
  // transitions: white flash at cut + quick fade-in
  let fl=Math.max(0,1-lt/0.3)*0.5;if(sc.name==='intro')fl=Math.max(0,1-t/0.8);
  if(sc.obj.flash)fl=Math.max(fl,0.35);if(sc.obj.impact)fl=Math.max(fl,sc.obj.impact(lt)*0.45);
  const ne=SC[SC.indexOf(sc)+1];if(ne&&ne.a-t<0.15)fl=Math.max(fl,(0.15-(ne.a-t))/0.15*0.6);
  if(t>END-0.8)fl=0;
  drawOverlay(t,fl);
  if(t>END-0.8){ov.fillStyle=`rgba(0,0,0,${clamp((t-(END-0.8))/0.8)})`;ov.fillRect(0,0,W,H);}
};
window.ready=true;
